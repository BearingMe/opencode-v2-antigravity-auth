name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test with Bun
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        run: bun run typecheck

      - name: Check architecture boundaries
        run: bun run check:boundaries

      - name: Test architecture boundary checker
        run: bun run check:boundaries:test

      - name: Run tests
        run: bun run test

      - name: Run native TUI tests and build
        run: bun run test:tui

      - name: Smoke test built logging destinations
        run: bun run test:logging:smoke
